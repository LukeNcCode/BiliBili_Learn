name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm exec cross-env NODE_OPTIONS=--use-system-ca electron-builder --config electron-builder.config.cjs --win nsis --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish GitHub Release
        shell: pwsh
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            release-artifacts/*.exe `
            release-artifacts/*.blockmap `
            release-artifacts/latest.yml `
            --verify-tag `
            --notes-file RELEASE_NOTES.md `
            --title "$env:GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
